<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Registro</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Nombre de usuario" required>
            <input type="email" id="email" placeholder="Correo Electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <input type="password" id="confirm_password" placeholder="Confirmar Contraseña" required>

            <select id="role">
                <option value="user">Usuario</option>
                <option value="admin">Administrador</option>
            </select>

            <select id="security_question" required>
                <option value="">Selecciona una pregunta de seguridad</option>
                <option value="color">¿Cuál es tu color favorito?</option>
                <option value="mascota">¿Cómo se llama tu primera mascota?</option>
            </select>
            <input type="text" id="security_answer" placeholder="Respuesta" required>

            <button type="submit">Registrarse</button>
        </form>
        <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
    <script src="registro.js"></script>
</body>
</html>
