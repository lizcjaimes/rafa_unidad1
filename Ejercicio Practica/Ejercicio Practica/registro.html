<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">

</head>
<body>
    <div class="register-container">
        <h2 class="text-center mb-4">Registro</h2>
        <form id="registerForm" action="register.php" method="POST">
            <div class="form-group">
                <i class="fas fa-user"></i>
                <input type="text" class="form-control" name="username" placeholder="Nombre de usuario" required>
            </div>

            <div class="form-group">
                <i class="fas fa-envelope"></i>
                <input type="email" class="form-control" name="email" placeholder="Correo Electrónico" required>
            </div>

            <div class="form-group">
                <i class="fas fa-lock"></i>
                <input type="password" class="form-control" name="password" placeholder="Contraseña" required>
            </div>

            <div class="form-group">
                <i class="fas fa-shield-alt"></i>
                <input type="password" class="form-control" name="confirm_password" placeholder="Confirmar Contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
        </form>

        <div class="login-link">
            ¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a>
        </div>
    </div>

    <!-- Modal de Pregunta de Seguridad  -->
    <div class="modal fade" id="securityQuestionModal" tabindex="-1" aria-labelledby="securityQuestionModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="securityQuestionModalLabel">Pregunta de Seguridad</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="security_question">Selecciona una pregunta de seguridad:</label>
                        <select class="form-control" id="security_question" required>
                            <option value="">Selecciona una opción</option>
                            <option value="color">¿Cuál es tu color favorito?</option>
                            <option value="mascota">¿Cómo se llama tu primera mascota?</option>
                            <option value="escuela">¿Cuál es el nombre de tu escuela primaria?</option>
                        </select>
                    </div>
                    <div class="form-group mt-2">
                        <input type="text" class="form-control" id="security_answer" placeholder="Respuesta" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" onclick="submitForm()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const password = document.querySelector('input[name="password"]').value;
            const confirmPassword = document.querySelector('input[name="confirm_password"]').value;

            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}$/;

            if (!passwordRegex.test(password)) {
                alert('La contraseña debe tener al menos 6 caracteres, una mayúscula, una minúscula y un número.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden.');
                return;
            }

            var modal = new bootstrap.Modal(document.getElementById('securityQuestionModal'));
            modal.show();
        });

        function submitForm() {
            const question = document.getElementById('security_question').value;
            const answer = document.getElementById('security_answer').value;

            if (question && answer.length >= 3) {
                document.getElementById('registerForm').submit();
            } else {
                alert('Por favor selecciona una pregunta y responde con al menos 3 caracteres.');
            }
        }
    </script>
</body>
</html>
