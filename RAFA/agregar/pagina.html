<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="/dashboard.css">
    <title>Gestión de Proyectos</title>
</head>
<body>
    <div class="barra-lateral">
        <div class="nombre-pagina">
            <ion-icon id="home" name="menu-outline"></ion-icon>
            <span>BIENVENIDO</span>
        </div>
        <!-- <button class="boton" onclick="window.location.href='/proyectoss.html'">
            <ion-icon name="add-outline"></ion-icon>
            <span>Crear nuevo</span>
        </button> -->

        <a href="/agregar/pagina.html" class="boton">
            <ion-icon name="add-outline"></ion-icon>
            <span>Crear nuevo</span>
          </a>
          

        <nav class="navegacion">
            <ul>
                <li>
                    <a id="inbo" href="/prueba.html">
                        <ion-icon name="home-outline"></ion-icon> 
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="/proyectos.html">
                        <ion-icon name="folder-outline"></ion-icon>
                        <span>Proyectos</span>
                    </a>
                </li>
                <li>
                    <a href="../agregar/gestion_equipos.html">
                        <ion-icon name="people-outline"></ion-icon>
                        <span>Equipos</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <ion-icon name="settings-outline"></ion-icon>
                        <span>Configuración</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="linea"></div>
        <div class="modo-oscuro">
            <div class="info">
                <ion-icon name="moon-outline"></ion-icon>
                <span>Dark Mode</span>
            </div>
            <div class="switch">
                <div class="base">
                    <div class="circulo"></div>
                </div>
            </div>
        </div>
    </div>



    <div class="div-titulo">
        <h1>Proyecto Nuevo</h1>
    </div>

    <div class="contenedor">

        <div class="div-formulario">
            <h2>Formulario</h2>

            <form action="#" id="formulario">
                <input type="text" id="nombre" placeholder="Nombre del Proyecto">
                <input type="text" id="descripcion" placeholder="Breve Descripción">
                <input type="date" id="fecha">
                <input type="text" id="estado" placeholder="En curso, Completado, Pendiente">
                <button type="submit" id="btnAgregar">Agregar</button>
            </form>
        </div>

        <div class="div-listado">
            <h2>Listado de Proyectos</h2>
            <div class="div-proyectos"></div>
        </div>
        
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <script src="app.js"></script>
    <script src="/script.js"></script>
</body>
</html>
