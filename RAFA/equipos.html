<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Equipos</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="barra-lateral">
        <div class="nombre-pagina">
            <ion-icon id="home" name="menu-outline"></ion-icon>
            <span>BIENVENIDO</span>
        </div>

        <a href="/equipos.html" class="boton">
            <ion-icon name="add-outline"></ion-icon>
            <span>Crear nuevo</span>
        </a>

        <nav class="navegacion">
            <ul>
                <li>
                    <a href="/prueba.html">
                        <ion-icon name="home-outline"></ion-icon>
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="/proyectos.html">
                        <ion-icon name="people-outline"></ion-icon>
                        <span>Proyectos</span>
                    </a>
                </li>
                <li>
                    <a href="/agregar/gestion_equipos.html">
                        <ion-icon name="people-outline"></ion-icon>
                        <span>Equipos</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <ion-icon name="settings-outline"></ion-icon>
                        <span>Configuración</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="linea"></div>
        <div class="modo-oscuro">
            <div class="info">
                <ion-icon name="moon-outline"></ion-icon>
                <span>Dark Mode</span>
            </div>
            <div class="switch">
                <div class="base">
                    <div class="circulo"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="div-titulo">
        <h1>Gestión de Equipos</h1>
    </div>

    <div class="contenedor">
        <div class="div-formulario">
            <h2>Formulario</h2>

            <form id="formulario">
                <input type="text" id="nombre" placeholder="Nombre del Equipo">
                <input type="text" id="lider" placeholder="Líder del Equipo">
                <select id="proyecto"></select>
                <input type="text" id="integrantes" placeholder="Integrantes (separados por coma)">
                <button type="submit">Agregar</button>
            </form>
        </div>

        <div class="div-listado">
            <h2>Listado de Equipos</h2>
            <div class="div-equipos"></div>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <script src="equipos.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
